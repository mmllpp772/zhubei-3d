<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>緯創資通各廠區 3D 漫遊 · 需要密碼</title>
<style>:root{--bg:#eef3f1;--card:#fff;--ink:#21424a;--mut:#6a8287;--acc:#00838a}@media(prefers-color-scheme:dark){:root{--bg:#132327;--card:#1c3036;--ink:#e2eeec;--mut:#9cb4b4;--acc:#3fb6b4}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}form{background:var(--card);border-radius:10px;padding:26px 24px;width:100%;max-width:340px;box-shadow:0 8px 30px #0002}
h1{font-size:19px;margin:0 0 4px}p{margin:0 0 16px;color:var(--mut);font-size:13px}input[type=password]{width:100%;box-sizing:border-box;font-size:17px;padding:11px 12px;border:1px solid #9bb3b3;border-radius:6px;background:transparent;color:inherit}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.6}label{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}#m{min-height:20px;margin-top:10px;font-size:13px;color:#c0392b}</style></head>
<body><div class="w"><form id="f" action="javascript:void 0" onsubmit="return false"><h1>緯創資通各廠區 3D 漫遊</h1><p>內部版本，請輸入密碼開啟。</p><input id="pw" type="password" autocomplete="current-password" placeholder="密碼" autofocus required><label><input id="rem" type="checkbox"> 在這台裝置記住</label><button id="b" disabled>下載中…</button><div id="m"></div></form></div>
<script>const REPO='mmllpp772/zhubei-3d',S="pN9fMwc8mlLFE4KsXSRGAw==",V="6o7zhyIuN7GqDEAU",I=310000;let D=null,want=null;
const u=s=>typeof s!=='string'?s:Uint8Array.from(atob(s),c=>c.charCodeAt(0)),K='zb3d-key-'+S.slice(0,8);
async function open(raw,rem){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(V)},k,u(D));}catch(_){throw new Error('pw');}if(rem){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)));}catch(_){}}
 const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(S),iterations:I,hash:'SHA-256'},b,256));}
const m=document.getElementById('m'),btn=document.getElementById('b');
// the same file from several hosts at once (GitHub Pages is slow / unreliable from some networks, e.g. mainland China);
// after a few seconds only the fastest download is kept, and the result is checked against its SHA-256 before use
const F='data-51a5631902.bin',SRC=[F,'https://cdn.jsdelivr.net/gh/'+REPO+'@main/'+F,'https://fastly.jsdelivr.net/gh/'+REPO+'@main/'+F,'https://gcore.jsdelivr.net/gh/'+REPO+'@main/'+F];
async function grab(){const L=SRC.map(url=>({url,ac:new AbortController(),got:0,n:0,parts:[],done:false,err:null}));let best=null;
 const show=()=>{const s=L.reduce((a,b)=>(b.got>a.got?b:a),L[0]);const n=s.n||11792096;btn.textContent='下載中… '+Math.min(99,Math.round(s.got/n*100))+'%';};
 const run=async S=>{try{const r=await fetch(S.url,{signal:S.ac.signal,cache:'no-cache'});if(!r.ok)throw new Error(r.status);S.n=+r.headers.get('content-length')||0;const rd=r.body.getReader();for(;;){const {done,value}=await rd.read();if(done)break;S.parts.push(value);S.got+=value.length;show();}S.done=true;return S;}catch(e){S.err=e;throw e;}};
 const P=L.map(S=>run(S).then(S=>{const d=new Uint8Array(S.got);let o=0;for(const p of S.parts){d.set(p,o);o+=p.length;}return crypto.subtle.digest('SHA-256',d).then(h=>{const hex=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,10);if(hex!=='51a5631902')throw new Error('hash');return d;});}));
 // keep only the leader after 4 s (or as soon as one host has clearly failed)
 setTimeout(()=>{const alive=L.filter(S=>!S.err);if(alive.length<2)return;const lead=alive.reduce((a,b)=>b.got>a.got?b:a);if(lead.got>0)for(const S of alive)if(S!==lead)S.ac.abort();},4000);
 const d=await Promise.any(P);for(const S of L)S.ac.abort();return d;}
const ready=(async()=>{for(let t=0;;t++){try{D=await grab();btn.disabled=false;btn.textContent='開啟';return;}catch(e){if(t>=2){btn.textContent='下載失敗，請重新整理';throw e;}await new Promise(r=>setTimeout(r,1500));}}})();
(async()=>{await ready;let s=null;try{s=localStorage.getItem(K);}catch(e){}if(s){m.style.color='inherit';m.textContent='載入中…';try{await open(u(s));return;}catch(e){try{localStorage.removeItem(K);}catch(_){}m.textContent='';}}})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(!D)return false;btn.disabled=true;m.style.color='inherit';m.textContent='解密中…';
 try{await open(await derive(document.getElementById('pw').value),document.getElementById('rem').checked);}
 catch(err){btn.disabled=false;m.style.color='';m.textContent=err.message==='pw'?'密碼錯誤':'無法開啟：'+err.message;}};</script></body></html>
